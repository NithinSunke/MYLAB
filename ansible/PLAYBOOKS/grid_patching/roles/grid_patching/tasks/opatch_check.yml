- name: Perform OPatch Apply patch (Apply) for oracle home
  shell: >
    source /home/oracle/setEnv.sh && 
    source /home/oracle/db_env &&
    {{ oracle_home }}/OPatch/opatchauto apply {{ patch_location }} -oh {{ oracle_home }}
  register: apply_result2
  become: yes
  become_user: root
  ignore_errors: yes

- name: Display available free space
  debug:
    msg: "{{ apply_result2.stdout }}"


