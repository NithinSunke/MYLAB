---
- name: Ensure OPatch is up to date
  shell: >
    source /home/oracle/setEnv.sh &&
    source /home/oracle/grid_env &&
    $ORACLE_HOME/OPatch/opatch version | grep '{{ opatch_version }}'
  register: opatch_check
  ignore_errors: yes

- name: Debug installation output
  debug:
    msg: "{{ opatch_check.stdout_lines }}"

