- name: Check available free space in /u01
  shell: df --output=avail -BG /u01 | tail -1 | tr -d 'G'
  register: free_space
  changed_when: false

- name: Validate if at least 20GB is available
  fail:
    msg: "Insufficient disk space on /u01. Required: 20GB, Available: {{ free_space.stdout }}GB"
  when: free_space.stdout | int < 20

- name: Display available free space
  debug:
    msg: "Available free space in /u01: {{ free_space.stdout }}GB"

