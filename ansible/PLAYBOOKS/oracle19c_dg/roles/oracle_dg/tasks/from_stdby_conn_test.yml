- name: Test Connection from Standby to primary
  shell: |
    source /home/oracle/profile_o19tcsb.sh
    {{ oracle_home }}/bin/sqlplus -s "sys/{{ sys_pwd }}@{{ primary_db }} as sysdba" <<EOF
    SELECT 'SUCCESS' FROM dual;
    EXIT;
    EOF
  register: standby_to_primary
  failed_when: standby_to_primary.rc > 0

- name: Display Standby  to Primary Connection Test Result
  debug:
    msg: "{{ standby_to_primary.stdout_lines }}"

- name: Test Connection from Standby to Standby
  shell: |
    source /home/oracle/profile_o19tcsb.sh
    {{ oracle_home }}/bin/sqlplus -s "sys/{{ sys_pwd }}@{{ standby_db }} as sysdba" <<EOF
    SELECT 'SUCCESS' FROM dual;
    EXIT;
    EOF
  register: standby_to_standby
  failed_when: standby_to_standby.rc > 0

- name: Display Standby to Standby Connection Test Result
  debug:
    msg: "{{ standby_to_standby.stdout_lines }}"
