- name: create spfile from pfile
  shell: |
    source /home/oracle/profile_o19tcsb.sh
    {{ oracle_home }}/bin/sqlplus -s "sys/{{ sys_pwd }}@{{ standby_db }} as sysdba" <<EOF
    create spfile from pfile;
    exit;
    EOF

- name: restart the database
  shell: |
    source /home/oracle/profile_o19tcsb.sh
    {{ oracle_home }}/bin/sqlplus -s "sys/{{ sys_pwd }}@{{ standby_db }} as sysdba" <<EOF
    shut immediate
    startup
    exit;
    EOF

- name: modify  Parameter at standby
  shell: |
    source /home/oracle/profile_o19tcsb.sh
    {{ oracle_home }}/bin/sqlplus -s "sys/{{ sys_pwd }}@{{ standby_db }} as sysdba" <<EOF
    ALTER SYSTEM RESET log_archive_dest_2 SCOPE=BOTH;
    alter system set fal_server='{{ primary_db }}' scope=both;
    alter system set log_archive_dest_state_2=ENABLE scope=spfile;
    EXIT;
    EOF
  register: sql_output
  failed_when: sql_output.rc > 0
  become: yes
  become_user: "{{ db_user }}"

- name: output of modified parameters
  debug:
    msg: "{{ sql_output.stdout_lines }}"

- name: clear redolog files
  shell: |
    source /home/oracle/profile_o19tcsb.sh
    {{ oracle_home }}/bin/sqlplus -s "sys/{{ sys_pwd }}@{{ standby_db }} as sysdba" <<EOF
    begin
    for log_cur in ( select group# group_no from v\$log )
    loop
    execute immediate 'alter database clear logfile group '||log_cur.group_no;
    end loop;
    end;
    /
    
    begin
    for log_cur in ( select group# group_no from v\$standby_log )
    loop
    execute immediate 'alter database clear logfile group '||log_cur.group_no;
    end loop;
    end;
    /
    exit;
    EOF
  become: yes
  become_user: "{{ db_user }}"
  register: clear_redo

- name: clear redolog files
  debug:
    msg: "{{ clear_redo.stdout_lines }}"

