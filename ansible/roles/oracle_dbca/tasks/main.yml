---
###############################################################################
# PRE-CHECKS
###############################################################################
- name: Check if database already exists
  stat:
    path: "{{ datafile_dest }}/{{ db_name }}"
  register: db_exists

- name: Fail if database already exists
  fail:
    msg: "Database {{ db_name }} already exists. DBCA will not be run."
  when: db_exists.stat.exists

###############################################################################
# CREATE REQUIRED DIRECTORIES
###############################################################################
- name: Create database directories
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ oracle_user }}"
    group: oinstall
    mode: '0755'
  loop:
    - "{{ datafile_dest }}"
    - "{{ recovery_dest }}"

###############################################################################
# RUN DBCA (SILENT)
###############################################################################
- name: Create database using DBCA
  ansible.builtin.shell:
    cmd: |
      export ORACLE_HOME={{ oracle_home }}
      export ORACLE_BASE={{ oracle_base }}
      export PATH=$ORACLE_HOME/bin:$PATH

      dbca -silent -createDatabase \
        -templateName General_Purpose.dbc \
        -gdbname {{ db_name }} \
        -sid {{ db_sid }} \
        -responseFile NO_VALUE \
        -createAsContainerDatabase true \
        -numberOfPDBs 1 \
        -pdbName {{ pdb_name }} \
        -pdbAdminPassword {{ pdb_admin_password }} \
        -sysPassword {{ sys_password }} \
        -systemPassword {{ system_password }} \
        -characterSet {{ db_characterset }} \
        -nationalCharacterSet {{ db_ncharacterset }} \
        -databaseType MULTIPURPOSE \
        -memoryMgmtType auto_sga \
        -totalMemory {{ db_memory }} \
        -storageType FS \
        -datafileDestination {{ datafile_dest }} \
        -recoveryAreaDestination {{ recovery_dest }} \
        -enableArchive true \
        -redoLogFileSize 50 \
        -ignorePreReqs \
        -emConfiguration NONE
  become_user: "{{ oracle_user }}"
  register: dbca_result
  failed_when: dbca_result.rc != 0

###############################################################################
# POST-CHECK
###############################################################################
- name: Verify database is registered in oratab
  shell: grep "^{{ db_sid }}:" /etc/oratab
  register: oratab_check
  failed_when: oratab_check.rc != 0
