- name: Create RAC CDB using DBCA (run from first node only)
  become: yes
  become_user: oracle
  shell: |
    export ORACLE_HOME={{ oracle_home }}
    export ORACLE_BASE={{ oracle_base }}
    export PATH=$ORACLE_HOME/bin:$PATH

    dbca -silent -createDatabase \
      -templateName General_Purpose.dbc \
      -gdbname {{ oracle_unqname }} \
      -responseFile NO_VALUE \
      -characterSet AL32UTF8 \
      -sysPassword {{ sys_password }} \
      -systemPassword {{ sys_password }} \
      -createAsContainerDatabase true \
      -numberOfPDBs 1 \
      -pdbName {{ pdb_name }} \
      -pdbAdminPassword {{ sys_password }} \
      -databaseType MULTIPURPOSE \
      -automaticMemoryManagement false \
      -totalMemory 1024 \
      -redoLogFileSize 50 \
      -emConfiguration NONE \
      -ignorePreReqs \
      -nodelist {{ node1_hostname }},{{ node2_hostname }} \
      -storageType ASM \
      -diskGroupName +DATA \
      -recoveryGroupName +RECO \
      -recoveryAreaSize 8098 \
      -useOMF true \
      -asmsnmpPassword {{ sys_password }}
  args:
    executable: /bin/bash
  when: inventory_hostname == groups['racnodes'][0]
  run_once: true
  register: dbca_output
  changed_when: "'100% complete' in dbca_output.stdout"

- name: Save db create output
  copy:
    content: "{{ dbca_output.stdout }}"
    dest: /tmp/dbca_output.log
  run_once: true
  when: inventory_hostname == groups['racnodes'][0]
  run_once: true

- name: Save PDB state for auto-start
  become: yes
  become_user: oracle
  shell: |
    export ORACLE_HOME={{ oracle_home }}
    export ORACLE_SID={{ oracle_unqname }}1
    export PATH=$ORACLE_HOME/bin:$PATH

    sqlplus -s / as sysdba <<EOF
    ALTER PLUGGABLE DATABASE {{ pdb_name }} SAVE STATE;
    EXIT;
    EOF
  args:
    executable: /bin/bash
  when: inventory_hostname == groups['racnodes'][0]

- name: Get database configuration
  become: yes
  become_user: oracle
  shell: |
    export ORACLE_HOME={{ oracle_home }}
    export PATH=$ORACLE_HOME/bin:$PATH
    srvctl config database -d {{ oracle_unqname }}
  args:
    executable: /bin/bash
  register: srvctl_config
  when: inventory_hostname == ansible_play_hosts_all[0]
  run_once: true

- name: Display database configuration
  debug:
    var: srvctl_config
  when: inventory_hostname == groups['racnodes'][0]
  run_once: true

- name: Get database status
  become: yes
  become_user: oracle
  shell: |
    export ORACLE_HOME={{ oracle_home }}
    export PATH=$ORACLE_HOME/bin:$PATH
    srvctl status database -d {{ oracle_unqname }}
  args:
    executable: /bin/bash
  register: srvctl_status
  when: inventory_hostname == ansible_play_hosts_all[0]
  run_once: true


- name: Display database status
  debug:
    var: srvctl_status
  when: inventory_hostname == groups['racnodes'][0]
  run_once: true
