# ------------------------------------------------------------------
# 2️⃣ Create Additional ASM Diskgroups
# ------------------------------------------------------------------

- name: Create DATA and RECO Diskgroups
  become: yes
  become_user: grid
  shell: |
    export ORACLE_HOME={{ grid_home }}
    export ORACLE_SID=+ASM1
    export PATH=$ORACLE_HOME/bin:$PATH

    sqlplus -s / as sysasm <<EOF
    CREATE DISKGROUP data EXTERNAL REDUNDANCY DISK '/dev/asm-data'
      ATTRIBUTE 'compatible.asm'='19.0','compatible.rdbms'='19.0';

    CREATE DISKGROUP reco EXTERNAL REDUNDANCY DISK '/dev/asm-fra'
      ATTRIBUTE 'compatible.asm'='19.0','compatible.rdbms'='19.0';

    SET LINESIZE 100
    COLUMN name FORMAT A30
    SELECT name, compatibility FROM v\$asm_diskgroup ORDER BY name;
    EXIT;
    EOF
  register: asm_output

- name: Show ASM Diskgroups
  debug:
    var: asm_output.stdout_lines

# ------------------------------------------------------------------
# 3️⃣ Check Cluster Resources
# ------------------------------------------------------------------

- name: Check CRS Resource Status
  become: yes
  become_user: grid
  shell: "{{ grid_home }}/bin/crsctl stat res -t"
  register: crs_status

- name: Show CRS Status
  debug:
    var: crs_status.stdout_lines