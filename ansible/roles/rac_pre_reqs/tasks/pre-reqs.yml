- name: Install Oracle preinstall dependencies
  package:
    name:
      - libxcrypt-compat
      - oracle-database-preinstall-19c
      - compat-openssl11
      - fontconfig
    state: present

- name: Configure limits for grid user
  become: yes
  blockinfile:
    path: /etc/security/limits.conf
    marker: "# {mark} ANSIBLE MANAGED GRID LIMITS"
    block: |
      grid soft memlock unlimited
      grid hard memlock unlimited
      grid soft nofile 1024
      grid hard nofile 65536
      grid soft nproc 16384
      grid hard nproc 16384
      grid soft stack 10240

- name: Create Grid directories
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ grid_user }}"
    group: oinstall
    mode: '0775'
  loop:
    - /u01/app
    - /u01/app/grid
    - /u01/app/26ai
    - /u01/app/26ai/grid
    - /u01/app/oraInventory

- name: Create DB directories
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ oracle_user }}"
    group: oinstall
    mode: 0775
  loop:
    - "{{ oracle_base }}"
    - "{{ oracle_home }}"


- name: Unzip Grid software
  become_user: "{{ grid_user }}"
  unarchive:
    src: /mnt/nfsshare/softs/LINUX.X64_2326100_grid_home.zip
    dest: "{{ grid_home }}"
    remote_src: yes
  delegate_to: o9o26airac01
  run_once: true

- name: Unzip DB software
  become_user: "{{ oracle_user }}"
  unarchive:
    src: /mnt/nfsshare/softs/LINUX.X64_2326100_db_home.zip
    dest: "{{ oracle_home }}"
    remote_src: yes
  delegate_to: o9o26airac01
  run_once: true


































































































































































































































































































